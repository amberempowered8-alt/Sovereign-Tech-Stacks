<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Tech Stacks | Custom Web Architecture</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="brand-name">SOVEREIGN TECH STACKS</h1>
            <p class="tagline">Custom HTML/CSS Web Architecture Deployed on GitHub. Zero Subscription Traps. Absolute Ownership.</p>
        </header>

        <main>
            <form class="sovereign-form" action="YOUR_ZAPIER_WEBHOOK_URL_HERE" method="POST">
                <h2 class="form-title">System Onboarding Application</h2>
                <p class="form-subtitle">Serious business owners and structured startups only. 15-minute alignment cap applies.</p>

                <div class="form-group">
                    <label for="client-name">Your Full Name / Entity Represented</label>
                    <input type="text" id="client-name" name="name" required placeholder="e.g., Amber Jackson">
                </div>

                <div class="form-email">
                    <label for="client-email">Secure Communication Email</label>
                    <input type="email" id="client-email" name="email" required placeholder="name@domain.com">
                </div>

                <div class="form-group">
                    <label for="current-site">Current Website / Social Link (If any)</label>
                    <input type="text" id="current-site" name="current_site" placeholder="www.yourcurrentsite.com or social handle">
                </div>

                <div class="form-group">
                    <label for="project-scope">Project Core Focus</label>
                    <select id="project-scope" name="project_scope" required>
                        <option value="">-- Select Your Pillar --</option>
                        <option value="startup">Brand New Startup (Ground-up Build)</option>
                        <option value="migration">Platform Migration (Escaping Squarespace/Shopify/Wix)</option>
                        <option value="portfolio">Professional Portfolio / Link-in-Bio System</option>
                    </select>
                </div>

                <div class="form-group Checkboxes">
                    <label>System Add-ons & Functional Metadata</label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="addons" value="payhip_checkout"> Payhip E-commerce Integration (Checkout)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="addons" value="qr_code"> Custom Asset QR Code Generation
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="addons" value="digital_biz_card"> Integrated Electronic Business Card Link
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="addons" value="retainer"> 6-Month Maintenance Retainer ($150/mo)
                    </label>
                </div>

                <div class="form-group">
                    <label for="budget">Investment Allocation (Custom Baseline Starts at $950)</label>
                    <select id="budget" name="budget" required>
                        <option value="">-- Select Budget Tier --</option>
                        <option value="ready_950">I am ready to allocate the $950+ custom framework investment</option>
                        <option value="not_ready">My budget is under $950 (Route me to the DIY Launchpad Blueprint for $150)</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Submit Architecture for Review →</button>
            </form>
        </main>
    </div>
</body>
</html>
